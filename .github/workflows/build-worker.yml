name: Build obfuscated worker.js

on:
  push:
    branches: [ main ]
    paths:
      - 'normal.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build worker.js from normal.js
        run: node scripts/build-worker.js

      - name: Commit and push worker.js if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker.js
          if git diff --cached --quiet; then
            echo "worker.js تغییری نکرده — چیزی برای کامیت نیست."
          else
            git commit -m "chore: rebuild obfuscated worker.js [skip ci]"
            git push
          fi
